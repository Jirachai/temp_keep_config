global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  
  - job_name: prometheus
    static_configs:
      - targets:
        - 127.0.0.1:9090
 
  - job_name: kong
    scrape_interval: 5s
    static_configs:
      - targets:
        - 10.141.1.223:8101
        - 10.141.1.224:8101

  - job_name: node-exporter-obs
    static_configs:
      - targets:
        - 10.141.1.229:9100
        - 10.141.1.228:9100

  - job_name: node-exporter-kong-01
    static_configs:
      - targets:
        - 10.141.1.223:9100

  - job_name: node-exporter-kong-02
    static_configs:
      - targets:
        - 10.141.1.224:9100

  - job_name: node-exporter-pg
    static_configs:
      - targets:
        - 10.141.1.225:9100
        - 10.141.1.226:9100
        - 10.141.1.227:9100

  - job_name: postgres-01
    static_configs:
      - targets:
        - 10.141.1.225:5432
    metrics_path: /probe
    params:
      auth_module: [kong]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 10.141.1.225:9187  # The postgres exporter's real hostname:port.
  
  - job_name: postgres-02
    static_configs:
      - targets:
        - 10.141.1.226:5432
    metrics_path: /probe
    params:
      auth_module: [kong]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 10.141.1.226:9187  # The postgres exporter's real hostname:port.

  - job_name: postgres-03
    static_configs:
      - targets:
        - 10.141.1.227:5432
    metrics_path: /probe
    params:
      auth_module: [kong]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 10.141.1.227:9187  # The postgres exporter's real hostname:port.
