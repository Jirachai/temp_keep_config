      KONG_PORTAL_EMAIL_VERIFICATION: "off"
      KONG_PORTAL_EMAILS_FROM: "IT_infra@th.msig-asia.com"
      KONG_PORTAL_EMAILS_REPLY_TO: "IT_infra@th.msig-asia.com"
      KONG_ADMIN_EMAILS_FROM: "IT_infra@th.msig-asia.com"
