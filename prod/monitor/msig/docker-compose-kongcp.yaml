      #KONG_PORTAL_GUI_HOST: ${KONG_PORTAL_GUI_HOST:-apidevpttst.msig-thai.com}
      KONG_PORTAL_GUI_SSL_CERT_KEY: "/etc/kong/ssl/msig.key"
      KONG_PORTAL_GUI_SSL_CERT: "/etc/kong/ssl/msig.crt"
      #KONG_PORTAL_API_URL: ${KONG_PORTAL_API_URI:-http://10.141.27.60:8004}
      #KONG_PORTAL_API_URL: ${KONG_PORTAL_API_URI:-https://10.141.27.60:8447}
      KONG_PORTAL_API_URL: ${KONG_PORTAL_API_URI:-https://apipttst.msig-thai.com}
