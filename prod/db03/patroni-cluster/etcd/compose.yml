services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: etcd
    restart: always
    network_mode: host
    volumes:
      - ./data-etcd:/data
    command: |
      etcd
      -name etcd2
      -data-dir /data
      -advertise-client-urls http://10.141.1.227:2379,http://10.141.1.227:4001
      -listen-client-urls http://0.0.0.0:2379,http://0.0.0.0:4001
      -initial-advertise-peer-urls http://10.141.1.227:2380
      -listen-peer-urls http://0.0.0.0:2380
      -initial-cluster-token etcd-cluster
      -initial-cluster etcd0=http://10.141.1.225:2380,etcd1=http://10.141.1.226:2380,etcd2=http://10.141.1.227:2380
      -initial-cluster-state new
      -enable-v2=true
