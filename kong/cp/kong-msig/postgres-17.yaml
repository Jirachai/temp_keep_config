networks:
  kong-ee-db-net:
    name: kong-ee-db-net
    driver: bridge
services:
  postgres:
    image: postgres:17
    networks:
      - kong-ee-db-net
    container_name: postgres
    hostname: postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 12s
      timeout: 6s
      retries: 3
    restart: always
    stdin_open: true
    tty: true
    volumes:
      - ${PWD}/postgresql_data:/var/lib/postgresql/data
    environment:
      TZ: Asia/Bangkok
      POSTGRES_DB: ${POSTGRES_DB:-kong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kong}
      POSTGRES_USER: ${POSTGRES_USER:-kong}
    ports:
      - "5432:5432"
  kong-migrations-bootstrap:
    image: kong/kong-gateway:${KONG_GW_VERSION:-3.9}
    networks:
      - kong-ee-db-net
    container_name: kong-migrations-bootstrap
    depends_on:
      postgres:
        condition: service_healthy
    command: kong migrations bootstrap --vv
    restart: on-failure
    environment:
      KONG_DATABASE: ${KONG_DATABASE:-postgres}
      KONG_ENFORCE_RBAC: "on"
      KONG_PG_HOST: ${KONG_PG_HOST:-postgres}
      KONG_PG_DATABASE: ${KONG_PG_DATABASE:-kong}
      KONG_PG_USER: ${KONG_PG_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:-kong}
      KONG_PASSWORD: ${KONG_PASSWORD:-kong}
      KONG_LOG_LEVEL: "warn"
  kong-migrations-up:
    image: kong/kong-gateway:${KONG_GW_VERSION:-3.9}
    networks:
      - kong-ee-db-net
    container_name: kong-migrations-up
    depends_on:
      kong-migrations-bootstrap:
        condition: service_completed_successfully
    command: kong migrations up --vv
    restart: on-failure
    environment:
      KONG_DATABASE: ${KONG_DATABASE:-postgres}
      KONG_ENFORCE_RBAC: "on"
      KONG_PG_HOST: ${KONG_PG_HOST:-postgres}
      KONG_PG_DATABASE: ${KONG_PG_DATABASE:-kong}
      KONG_PG_USER: ${KONG_PG_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:-kong}
      KONG_PASSWORD: ${KONG_PASSWORD:-kong}
      KONG_LOG_LEVEL: "warn"
  kong-migrations-finish:
    image: kong/kong-gateway:${KONG_GW_VERSION:-3.9}
    networks:
      - kong-ee-db-net
    container_name: kong-migrations-finish
    depends_on:
      kong-migrations-up:
        condition: service_completed_successfully
    command: kong migrations finish --vv
    restart: on-failure
    environment:
      KONG_DATABASE: ${KONG_DATABASE:-postgres}
      KONG_ENFORCE_RBAC: "on"
      KONG_PG_HOST: ${KONG_PG_HOST:-postgres}
      KONG_PG_DATABASE: ${KONG_PG_DATABASE:-kong}
      KONG_PG_USER: ${KONG_PG_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:-kong}
      KONG_PASSWORD: ${KONG_PASSWORD:-kong}
      KONG_LOG_LEVEL: "warn"
  